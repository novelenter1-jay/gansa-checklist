<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심의 준비 사전 체크리스트</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--ink:#1b2a2e;--sub:#5b6b6f;--line:#dbe5e6;--main:#2f6f7a;--deep:#0f2f36;--warm:#d98e3f;--warmbg:#f8ebdb;--no:#b5483a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--deep);color:#fff;padding:20px 16px 16px}
header p{margin:0;color:#7fa9b0;font-size:13px;font-weight:700}
header h1{margin:4px 0 6px;font-size:22px;line-height:1.3}
header span{font-size:14px;color:#cfe0e2}
.bar{position:sticky;top:0;z-index:5;background:var(--deep);padding:8px 16px 10px}
.track{height:8px;background:#27484f;border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--warm);transition:width .2s}
.count{color:#cfe0e2;font-size:12px;margin-top:4px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
#sync{color:#7fa9b0}
main{max-width:640px;margin:0 auto;padding:16px}
.how{background:var(--warmbg);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
h2{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;align-items:center;justify-content:center;font-size:14px;flex:none}
h2 small{font-weight:400;color:var(--sub);font-size:13px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item p{margin:0 0 10px;font-size:15px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:14px;color:var(--ink);padding:6px 4px}
.opts button[aria-pressed="true"]{color:#fff;font-weight:700;border-color:transparent}
.opts button.y[aria-pressed="true"]{background:var(--main)}
.opts button.d[aria-pressed="true"]{background:var(--warm)}
.opts button.n[aria-pressed="true"]{background:var(--no)}
.opts button:focus-visible,.act button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
#result{background:var(--card);border:2px solid var(--main);border-radius:14px;padding:16px;margin-top:24px}
#result h2{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
#list{margin:12px 0 0;padding-left:18px;font-size:14px}
#list li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;color:#fff}
.tag.d{background:var(--warm)}.tag.n{background:var(--no)}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act button{flex:1;min-height:46px;border-radius:10px;border:0;font:inherit;font-weight:700;font-size:15px;padding:8px 12px}
#copy{background:var(--main);color:#fff}#reset{background:#e6ecec;color:var(--ink)}
#msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px}
footer{color:var(--sub);font-size:12px;text-align:center;padding:20px 16px 32px}
</style>
</head>
<body>
<header>
  <p>2026 간사 역량강화 연수 · 2026. 11. 19.</p>
  <h1>심의 준비 사전 체크리스트</h1>
  <span>배당부터 회의록까지, 지금 내가 하고 있는 방식 그대로 답해 주세요.</span>
</header>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><div class="count"><span id="sync"></span> <span id="count">0 / 40</span></div></div>
<main>
  <div class="how">잘하고 있는지 보는 표가 아닙니다. <b>다르게 하고 있는 곳</b>을 찾으려는 것이니 평소대로 골라 주세요. 이름은 적지 않습니다. 누가 어떤 답을 했는지는 결과 화면에 나오지 않습니다.</div>
  <div id="stages"></div>
  <section id="result" aria-live="polite">
    <h2>내 결과</h2>
    <table><thead><tr><th>구간</th><th>하고 있음</th><th>다르게 함</th><th>안 함</th></tr></thead><tbody id="tb"></tbody></table>
    <ol id="list"></ol>
    <div class="act"><button id="copy" type="button">결과 복사하기</button><button id="reset" type="button">처음부터 다시</button></div>
    <div id="msg"></div>
  </section>
</main>
<footer>경기도화성오산교육지원청 학교폭력제로센터</footer>
<script>
const DATA=[
["배당과 사안 파악","배당 확인 즉시",[
"배당을 확인하면 위원에게 날짜와 시간부터 알린다",
"필수 서류 네 가지(학생확인서, 전담기구 결과 보고서, 사안조사 보고서, 관련 학생 개인정보)가 모두 왔는지 확인한다",
"사안조사 보고서 내용을 학생확인서와 대조한다",
"학생확인서에 서명과 날짜가 빠졌으면 다시 받는다",
"전담기구 보고서의 요건 판단이 ○, ×로 되어 있는지 본다(\"판단불가\"는 보완 요청)",
"학생선수, 특수교육대상, 다문화(통역) 여부를 확인한다",
"같은 학생의 다른 사안이 있는지 확인한다(병합 여부)",
"입장 순서를 미리 정해 둔다"]],
["참석 안내","심의 10일 전까지",[
"학부모 통화에서 날짜와 시간, 주소, 우편 수령 방법, 참석자를 확인한다",
"서류에 없는 보호자가 참석한다면 성함을 받아 둔다",
"통화가 안 되면 날짜와 시간을 문자로 남긴다",
"참석안내문을 심의 10일 전까지 우편으로 보낸다",
"안내문의 날짜, 시간, 학년반이 통화한 내용과 같은지 대조한다",
"피해와 가해 봉투를 구분하고, 피해 측에 전문가 의견 청취 안내를 넣는다",
"학교 개최 알림 공문, 위원장과 경찰 위원 출장 공문을 보낸다",
"위원에게 자료 메일을 보내고, 보냈다고 알린다"]],
["심의 직전","2~3일 전, 하루 전",[
"심의 하루 전, 내 앞으로 온 추가 공문이 없는지 확인한다",
"보호자가 메일이나 팩스로 직접 보낸 자료를 챙긴다",
"추가 자료를 받으면 바로 위원에게 보낸다",
"심의 2~3일 전 2차 안내 문자를 보낸다",
"변호사가 참석하면 위원장께 미리 알리고 서류를 받는다(자격 확인, 선임서 또는 위임장, 경유확인서)",
"부모가 아닌 사람이 참석하면 가족관계증명서, 신분증, 위임장을 확인한다",
"요약서, 참석확인표, 조치결정의견서, 의결서, 등록부를 인쇄한다",
"탭에 올릴 자료를 하루 전이나 당일에 넘긴다"]],
["심의 당일","30분 전부터",[
"심의 30분 전, 탭에 당일 자료가 올라왔는지 확인한다",
"속기사가 도착했는지 확인한다",
"현장에서 낸 자료를 파일로 받아 둔다",
"학생이 가운데(위원장과 마주 보는 자리)에 앉고 학생 마이크가 켜졌는지 본다",
"대기실 상황을 보면서 진행한다",
"의결서와 등록부에 서명이 빠지지 않았는지 확인한다",
"위원이 작성한 조치결정 서류를 챙긴다",
"퇴장할 때 \"통보서는 2주 이내 등기로 발송\"을 안내한다"]],
["심의 후","당일 / 2주 이내",[
"의결통고를 심의 당일에 등록한다(당일 받은 추가 자료 포함)",
"통보서를 당일이나 다음 날 작성하고, 위원이 쓴 조치 내용과 대조한다",
"내부결재 뒤 학부모 우편과 학교 공문을 심의 후 2주 이내에 보낸다(빠른등기)",
"피해학생 보호조치가 있으면 1주 이내에 보낸다",
"통보서가 반송되면 통화로 주소를 확인하고 다시 보낸다",
"속기록을 받으면 회의록을 작성해 등록한다(정보공개, 행정심판이 예상되면 먼저)",
"결과에 항의하는 전화에는 자세한 설명 대신 불복 절차를 안내한다",
"회의록을 공개할 때 학교, 학년반, 이름과 민감한 내용을 가린다"]]];
const OPT=[["y","하고 있음"],["d","다르게 함"],["n","안 하고 있음"]];
/* ▼ Firebase Realtime Database 주소를 넣으면 응답이 결과 화면에 실시간으로 모입니다. 비워 두면 이 휴대전화에만 남습니다. */
const DB_URL="";            // 예: "https://내프로젝트-default-rtdb.firebaseio.com"
const ROOM="gansa1119";
const KEY="gansa-checklist-2026-11-19";
let ans={};
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){ans={}}
let rid="";try{rid=localStorage.getItem(KEY+"-id")||""}catch(e){}
if(!rid){rid="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem(KEY+"-id",rid)}catch(e){}}
let timer=null;
const sync=()=>{if(!DB_URL)return;clearTimeout(timer);timer=setTimeout(async()=>{
  const st=document.getElementById("sync");
  try{const r=await fetch(DB_URL.replace(/\/$/,"")+"/"+ROOM+"/responses/"+rid+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({a:ans,t:Date.now()})});
    st.textContent=r.ok?"결과 화면에 반영되었습니다.":"전송이 거부되었습니다. 답은 이 휴대전화에 남아 있습니다."}
  catch(e){st.textContent="전송하지 못했습니다. 연결을 확인해 주세요. 답은 이 휴대전화에 남아 있습니다."}},700)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}sync()};
const total=DATA.reduce((a,s)=>a+s[2].length,0);
const stages=document.getElementById("stages");
DATA.forEach((s,si)=>{
  const h=document.createElement("h2");
  h.innerHTML="<b>"+(si+1)+"</b>"+s[0]+" <small>"+s[1]+"</small>";stages.appendChild(h);
  s[2].forEach((t,ii)=>{
    const id=si+"-"+ii,d=document.createElement("div");d.className="item";
    const p=document.createElement("p");p.textContent=(ii+1)+". "+t;d.appendChild(p);
    const o=document.createElement("div");o.className="opts";o.setAttribute("role","group");o.setAttribute("aria-label",t);
    OPT.forEach(([k,l])=>{
      const b=document.createElement("button");b.type="button";b.className=k;b.textContent=l;
      b.setAttribute("aria-pressed",ans[id]===k?"true":"false");
      b.addEventListener("click",()=>{ans[id]=k;save();o.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));render()});
      o.appendChild(b)});
    d.appendChild(o);stages.appendChild(d)})});
function summary(){
  const rows=DATA.map((s,si)=>{const c={y:0,d:0,n:0};s[2].forEach((_,ii)=>{const a=ans[si+"-"+ii];if(a)c[a]++});return c});
  const diff=[];DATA.forEach((s,si)=>s[2].forEach((t,ii)=>{const a=ans[si+"-"+ii];if(a==="d"||a==="n")diff.push([a,si+1,ii+1,t])}));
  return{rows,diff,done:Object.keys(ans).length}}
function render(){
  const{rows,diff,done}=summary();
  document.getElementById("fill").style.width=(done/total*100)+"%";
  document.getElementById("count").textContent=done+" / "+total;
  const tb=document.getElementById("tb");tb.innerHTML="";
  rows.forEach((c,i)=>{const tr=document.createElement("tr");[(i+1)+". "+DATA[i][0],c.y,c.d,c.n].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
  const ol=document.getElementById("list");ol.innerHTML="";
  diff.forEach(([a,s,i,t])=>{const li=document.createElement("li");const g=document.createElement("span");g.className="tag "+a;g.textContent=a==="d"?"다르게":"안 함";li.appendChild(g);li.appendChild(document.createTextNode(s+"-"+i+" "+t));ol.appendChild(li)});
  if(!diff.length){const li=document.createElement("li");li.textContent=done?"다르게 하거나 안 하는 항목이 아직 없습니다.":"답을 고르면 여기에 정리됩니다.";ol.appendChild(li)}}
document.getElementById("copy").addEventListener("click",async()=>{
  const{rows,diff,done}=summary();
  let t="[심의 준비 사전 체크리스트] "+done+"/"+total+" 응답\n";
  rows.forEach((c,i)=>{t+=(i+1)+". "+DATA[i][0]+": 하고 있음 "+c.y+", 다르게 "+c.d+", 안 함 "+c.n+"\n"});
  if(diff.length){t+="\n다르게 하거나 안 하는 항목\n";diff.forEach(([a,s,i,x])=>{t+="- ("+(a==="d"?"다르게":"안 함")+") "+s+"-"+i+" "+x+"\n"})}
  const m=document.getElementById("msg");
  try{await navigator.clipboard.writeText(t);m.textContent="복사했습니다. 메신저에 붙여 넣어 보내 주세요."}
  catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();m.textContent=ok?"복사했습니다. 메신저에 붙여 넣어 보내 주세요.":"복사가 막혀 있습니다. 화면을 캡처해 보내 주세요."}});
let armed=false;
document.getElementById("reset").addEventListener("click",e=>{
  const m=document.getElementById("msg");
  if(!armed){armed=true;e.target.textContent="한 번 더 누르면 지워집니다";m.textContent="";setTimeout(()=>{armed=false;e.target.textContent="처음부터 다시"},4000);return}
  ans={};save();document.querySelectorAll(".opts button").forEach(b=>b.setAttribute("aria-pressed","false"));armed=false;e.target.textContent="처음부터 다시";render();window.scrollTo({top:0})});
render();if(Object.keys(ans).length)sync();
</script>
</body>
</html>
