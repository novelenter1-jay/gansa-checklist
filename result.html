<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심의 준비 체크리스트 결과</title>
<style>
:root{--bg:#0f2f36;--panel:#17404a;--ink:#fff;--sub:#a9c6ca;--line:#2a5560;--y:#4fb3a6;--d:#e6a04e;--n:#e0705f;--none:#2a5560}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding:20px max(16px,2vw) 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
header p{margin:0;color:var(--sub);font-size:14px;font-weight:700}
h1{margin:2px 0 0;font-size:clamp(22px,2.6vw,34px)}
.who{display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.who b{font-size:clamp(34px,4vw,56px);color:var(--d);line-height:1}
.who span{color:var(--sub);font-size:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;margin:0 0 14px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.grid{display:grid;grid-template-columns:minmax(260px,1fr) 2.2fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:14px;padding:16px;min-width:0}
.panel h2{margin:0 0 10px;font-size:17px;color:var(--sub);font-weight:700}
#total{display:flex;flex-direction:column;align-items:center;gap:8px}
#total svg{width:min(100%,300px);height:auto}
.nums{display:flex;gap:14px;font-size:15px;font-variant-numeric:tabular-nums;flex-wrap:wrap;justify-content:center}
.nums b{font-size:20px}
#stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:820px){#stages{grid-template-columns:repeat(2,1fr)}}
.st{background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 6px;color:inherit;font:inherit;text-align:center;cursor:pointer;min-width:0}
.st[aria-pressed="true"]{border-color:var(--d);background:#1d4b56}
.st:focus-visible,button:focus-visible{outline:3px solid var(--d);outline-offset:2px}
.st svg{width:min(100%,130px);height:auto}
.st strong{display:block;font-size:15px;margin-top:4px}
.st small{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
#items{margin-top:16px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
@media(max-width:820px){.row{grid-template-columns:1fr}}
.row p{margin:0;font-size:clamp(15px,1.25vw,19px)}
.row p em{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums;margin-right:6px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--none)}
.bar span{display:block;height:100%}
.cnt{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt b{color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button,#clear{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--d);border-color:var(--d);color:#0f2f36;font-weight:700}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;color:var(--sub);font-size:13px}
.empty{color:var(--sub);padding:18px 0;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><p>2026 간사 역량강화 연수 · 심의 준비 사전 체크리스트</p><h1>우리는 지금 이렇게 하고 있습니다</h1></div>
  <div class="who"><b id="n">0</b><span>명 응답 · <span id="full">0</span>명 완료</span></div>
</header>
<div class="legend"><span><i style="background:var(--y)"></i>하고 있음</span><span><i style="background:var(--d)"></i>다르게 함</span><span><i style="background:var(--n)"></i>안 하고 있음</span><span><i style="background:var(--none)"></i>아직 답 없음</span></div>
<div class="grid">
  <section class="panel"><h2>전체</h2><div id="total"></div></section>
  <section class="panel"><h2>구간별 (누르면 그 구간 항목만 봅니다)</h2><div id="stages"></div></section>
</div>
<section class="panel" id="items">
  <div class="tabs" id="tabs"></div>
  <div id="rows"></div>
</section>
<footer><span id="status">불러오는 중</span><button id="clear" type="button">응답 모두 지우기</button></footer>
</div>
<script>
const DATA=[
["배당과 사안 파악","배당 확인 즉시",[
"배당을 확인하면 위원에게 날짜와 시간부터 알린다",
"필수 서류 네 가지(학생확인서, 전담기구 결과 보고서, 사안조사 보고서, 관련 학생 개인정보)가 모두 왔는지 확인한다",
"사안조사 보고서 내용을 학생확인서와 대조한다",
"학생확인서에 서명과 날짜가 빠졌으면 다시 받는다",
"전담기구 보고서의 요건 판단이 ○, ×로 되어 있는지 본다(\"판단불가\"는 보완 요청)",
"학생선수, 특수교육대상, 다문화(통역) 여부를 확인한다",
"같은 학생의 다른 사안이 있는지 확인한다(병합 여부)",
"입장 순서를 미리 정해 둔다"]],
["참석 안내","심의 10일 전까지",[
"학부모 통화에서 날짜와 시간, 주소, 우편 수령 방법, 참석자를 확인한다",
"서류에 없는 보호자가 참석한다면 성함을 받아 둔다",
"통화가 안 되면 날짜와 시간을 문자로 남긴다",
"참석안내문을 심의 10일 전까지 우편으로 보낸다",
"안내문의 날짜, 시간, 학년반이 통화한 내용과 같은지 대조한다",
"피해와 가해 봉투를 구분하고, 피해 측에 전문가 의견 청취 안내를 넣는다",
"학교 개최 알림 공문, 위원장과 경찰 위원 출장 공문을 보낸다",
"위원에게 자료 메일을 보내고, 보냈다고 알린다"]],
["심의 직전","2~3일 전, 하루 전",[
"심의 하루 전, 내 앞으로 온 추가 공문이 없는지 확인한다",
"보호자가 메일이나 팩스로 직접 보낸 자료를 챙긴다",
"추가 자료를 받으면 바로 위원에게 보낸다",
"심의 2~3일 전 2차 안내 문자를 보낸다",
"변호사가 참석하면 위원장께 미리 알리고 서류를 받는다(자격 확인, 선임서 또는 위임장, 경유확인서)",
"부모가 아닌 사람이 참석하면 가족관계증명서, 신분증, 위임장을 확인한다",
"요약서, 참석확인표, 조치결정의견서, 의결서, 등록부를 인쇄한다",
"탭에 올릴 자료를 하루 전이나 당일에 넘긴다"]],
["심의 당일","30분 전부터",[
"심의 30분 전, 탭에 당일 자료가 올라왔는지 확인한다",
"속기사가 도착했는지 확인한다",
"현장에서 낸 자료를 파일로 받아 둔다",
"학생이 가운데(위원장과 마주 보는 자리)에 앉고 학생 마이크가 켜졌는지 본다",
"대기실 상황을 보면서 진행한다",
"의결서와 등록부에 서명이 빠지지 않았는지 확인한다",
"위원이 작성한 조치결정 서류를 챙긴다",
"퇴장할 때 \"통보서는 2주 이내 등기로 발송\"을 안내한다"]],
["심의 후","당일 / 2주 이내",[
"의결통고를 심의 당일에 등록한다(당일 받은 추가 자료 포함)",
"통보서를 당일이나 다음 날 작성하고, 위원이 쓴 조치 내용과 대조한다",
"내부결재 뒤 학부모 우편과 학교 공문을 심의 후 2주 이내에 보낸다(빠른등기)",
"피해학생 보호조치가 있으면 1주 이내에 보낸다",
"통보서가 반송되면 통화로 주소를 확인하고 다시 보낸다",
"속기록을 받으면 회의록을 작성해 등록한다(정보공개, 행정심판이 예상되면 먼저)",
"결과에 항의하는 전화에는 자세한 설명 대신 불복 절차를 안내한다",
"회의록을 공개할 때 학교, 학년반, 이름과 민감한 내용을 가린다"]]];

/* ▼ 체크리스트 파일과 같은 주소를 넣습니다. */
const DB_URL="";            // 예: "https://내프로젝트-default-rtdb.firebaseio.com"
const ROOM="gansa1119";
const base=()=>DB_URL.replace(/\/$/,"")+"/"+ROOM+"/responses";
const total=DATA.reduce((a,s)=>a+s[2].length,0);
let resp={},view="top",stage=-1;
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function donut(c,size,label){
  const sum=c.y+c.d+c.n,R=40,W=14,C=2*Math.PI*R;let off=0,segs="";
  [["y","--y"],["d","--d"],["n","--n"]].forEach(([k,v])=>{if(!c[k])return;const len=c[k]/sum*C;
    segs+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+css(v)+'" stroke-width="'+W+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 50 50)"/>';off+=len});
  const pct=sum?Math.round(c.y/sum*100):0;
  return '<svg viewBox="0 0 100 100" role="img" aria-label="'+label+' 하고 있음 '+pct+'%"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+css("--none")+'" stroke-width="'+W+'"/>'+segs+
    '<text x="50" y="'+(sum?49:54)+'" text-anchor="middle" font-size="'+(sum?20:10)+'" font-weight="700" fill="'+css("--ink")+'">'+(sum?pct+"%":"응답 대기")+'</text>'+(sum?'<text x="50" y="62" text-anchor="middle" font-size="7.5" fill="'+css("--sub")+'">하고 있음</text>':'')+'</svg>'}
function tally(){
  const items=[];DATA.forEach((s,si)=>s[2].forEach((t,ii)=>items.push({si,ii,t,y:0,d:0,n:0})));
  const idx={};items.forEach(it=>idx[it.si+"-"+it.ii]=it);
  let n=0,full=0;
  Object.values(resp||{}).forEach(r=>{const a=r&&r.a;if(!a||typeof a!=="object")return;let c=0;
    Object.keys(a).forEach(k=>{const it=idx[k],v=a[k];if(it&&(v==="y"||v==="d"||v==="n")){it[v]++;c++}});
    if(c){n++;if(c>=total)full++}});
  return{items,n,full}}
function render(){
  const{items,n,full}=tally();
  document.getElementById("n").textContent=n;document.getElementById("full").textContent=full;
  const all={y:0,d:0,n:0};items.forEach(it=>{all.y+=it.y;all.d+=it.d;all.n+=it.n});
  document.getElementById("total").innerHTML=donut(all,300,"전체")+'<div class="nums"><span>하고 있음 <b>'+all.y+'</b></span><span>다르게 <b>'+all.d+'</b></span><span>안 함 <b>'+all.n+'</b></span></div>';
  const st=document.getElementById("stages");st.innerHTML="";
  DATA.forEach((s,si)=>{const c={y:0,d:0,n:0};items.filter(it=>it.si===si).forEach(it=>{c.y+=it.y;c.d+=it.d;c.n+=it.n});
    const b=document.createElement("button");b.type="button";b.className="st";b.setAttribute("aria-pressed",view==="stage"&&stage===si?"true":"false");
    b.innerHTML=donut(c,130,s[0])+"<strong>"+(si+1)+". "+s[0].replace("과 사안 파악","·사안 파악")+"</strong><small>다르게 "+c.d+" · 안 함 "+c.n+"</small>";
    b.addEventListener("click",()=>{view="stage";stage=si;render()});st.appendChild(b)});
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  [["top","가장 많이 갈린 항목 10개"],["all","전체 40개"]].forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.setAttribute("aria-pressed",view===k?"true":"false");b.addEventListener("click",()=>{view=k;stage=-1;render()});tabs.appendChild(b)});
  let list=items.slice();
  if(view==="top")list=list.filter(it=>it.d+it.n>0).sort((a,b)=>(b.d+b.n)-(a.d+a.n)||b.n-a.n).slice(0,10);
  if(view==="stage")list=list.filter(it=>it.si===stage);
  const rows=document.getElementById("rows");rows.innerHTML="";
  if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent=n?"아직 '다르게 함'이나 '안 하고 있음'이 나온 항목이 없습니다.":"응답이 들어오면 여기에 나타납니다.";rows.appendChild(e)}
  list.forEach(it=>{const r=document.createElement("div");r.className="row";
    const p=document.createElement("p");const em=document.createElement("em");em.textContent=(it.si+1)+"-"+(it.ii+1);p.appendChild(em);p.appendChild(document.createTextNode(it.t));
    const bar=document.createElement("div");bar.className="bar";const den=Math.max(n,it.y+it.d+it.n,1);
    [["y","--y"],["d","--d"],["n","--n"]].forEach(([k,v])=>{if(!it[k])return;const sp=document.createElement("span");sp.style.width=(it[k]/den*100)+"%";sp.style.background="var("+v+")";bar.appendChild(sp)});
    const c=document.createElement("div");c.className="cnt";c.innerHTML="하고 있음 <b>"+it.y+"</b> · 다르게 <b>"+it.d+"</b> · 안 함 <b>"+it.n+"</b>";
    r.appendChild(p);r.appendChild(bar);r.appendChild(c);rows.appendChild(r)})}
const status=document.getElementById("status");
async function load(){
  if(!DB_URL){status.textContent="DB_URL이 비어 있습니다. 파일 위쪽의 DB_URL에 Firebase 주소를 넣어 주세요.";return}
  try{const r=await fetch(base()+".json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    resp=await r.json()||{};render();status.textContent="3초마다 새로 고칩니다 · 마지막 "+new Date().toLocaleTimeString("ko-KR")}
  catch(e){status.textContent="불러오지 못했습니다("+e.message+"). 주소와 규칙을 확인해 주세요."}}
let armed=false;
document.getElementById("clear").addEventListener("click",async e=>{
  if(!armed){armed=true;e.target.textContent="한 번 더 누르면 모두 지워집니다";setTimeout(()=>{armed=false;e.target.textContent="응답 모두 지우기"},4000);return}
  armed=false;e.target.textContent="응답 모두 지우기";
  try{await fetch(base()+".json",{method:"DELETE"});resp={};render();status.textContent="모두 지웠습니다."}catch(_){status.textContent="지우지 못했습니다."}});
render();load();setInterval(load,3000);
</script>
</body>
</html>
